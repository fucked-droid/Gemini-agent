# CodeRabbit Configuration File
# yaml-language-server: $schema=https://coderabbit.ai/integrations/coderabbit-overrides.v2.json
language: "en-US"
early_access: false
reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
      - "develop"
  tools:
    ast-grep:
      enabled: true
    eslint:
      enabled: true
    shellcheck:
      enabled: true
chat:
  auto_reply: true
